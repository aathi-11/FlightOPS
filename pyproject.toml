[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "flightops"
version = "0.1.0"
description = "Decentralized multi-agent airport turnaround coordination simulator"
requires-python = ">=3.11"
dependencies = [
    "python-constraint",
    "flask",
]

[tool.setuptools]
packages = ["flightops"]
